name = "the-common-sense"
main = "server/worker.ts"
compatibility_date = "2026-10-01"

# The built app (npm run build). /api/* never matches a file, so it reaches the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers Logs: see why a read failed in the dashboard (Worker → Observability).
[observability]
enabled = true

[vars]
# Swap the Gemini model here without touching code.
GEMINI_MODEL = "gemini-3.8-flash"
# Thinking level sent to Gemini. Unset = model default. Its thought summaries
# stream to the waiting screen. Faster fallback model: "gemini-3.5-flash-lite".
GEMINI_THINKING_LEVEL = "low"
# Public OAuth client ID from Google Cloud Console (not a secret).
GOOGLE_CLIENT_ID = "149251525796-4u229rha4nelmd795p3ugfhondr9p6k2.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "common-sense"
database_id = "6bdf5221-9138-4769-ae11-347a37195edb"
migrations_dir = "migrations"

# Secret, set in the dashboard (Settings → Variables and Secrets) or with:
#   npx wrangler secret put GEMINI_API_KEY
